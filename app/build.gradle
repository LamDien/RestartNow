plugins {
    id 'com.android.application'
}

Properties properties = new Properties()
File localPropertiesFile = project.rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    properties.load(localPropertiesFile.newDataInputStream())
}

String admobAppId = properties.getProperty('ADMOB_APP_ID', 'ca-app-pub-3940256099942544~3347511713')
String admobBannerId = properties.getProperty('ADMOB_BANNER_ID', 'ca-app-pub-3940256099942544/6300978111')

android {
    namespace 'com.car.restartnow'
    compileSdk 34

    defaultConfig {
        applicationId "com.car.restartnow"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "2.0"

        manifestPlaceholders = [admobAppId: admobAppId]
        resValue "string", "admob_banner_id", admobBannerId

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.gms:play-services-ads:23.0.0'
    testImplementation 'junit:junit:4.13.2'
}

