<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="600" viewBox="0 0 1024 600">
    <!-- Dark Cockpit Background -->
    <rect width="1024" height="600" fill="#0A0F1D" />
    
    <!-- Top Header Left: Status Badge -->
    <rect x="32" y="32" width="280" height="36" rx="4" fill="#162234" />
    <circle cx="50" cy="50" r="4" fill="#00E5FF" />
    <text x="64" y="54" fill="#00E5FF" font-size="12" font-family="sans-serif" font-weight="bold" letter-spacing="1">HỆ THỐNG SẴN SÀNG • ROOT ACTIVE</text>
    
    <!-- Top Header Right: HeadUnit Tag -->
    <text x="992" y="54" fill="#94A3B8" font-size="13" font-family="sans-serif" font-weight="bold" text-anchor="end" letter-spacing="1">OWNICE C800 PRO</text>
    
    <!-- Button Glow Layer 1 -->
    <circle cx="512.0" cy="300.0" r="125" fill="#00E5FF" opacity="0.06" />
    <!-- Button Glow Layer 2 -->
    <circle cx="512.0" cy="300.0" r="117" fill="#00E5FF" opacity="0.12" stroke="#38BDF8" stroke-width="2" />
    <!-- Button Core Dark Radial Glass -->
    <circle cx="512.0" cy="300.0" r="109" fill="#0F1F35" stroke="#00E5FF" stroke-width="4" />
    
    <!-- Concentric Crosshairs (Subtle guide lines to prove centers coincide) -->
    <line x1="512.0" y1="180.0" x2="512.0" y2="420.0" stroke="#00E5FF" stroke-width="0.5" stroke-dasharray="3,3" opacity="0.3" />
    <line x1="392.0" y1="300.0" x2="632.0" y2="300.0" stroke="#00E5FF" stroke-width="0.5" stroke-dasharray="3,3" opacity="0.3" />

    <!-- Perfectly Centered Icon -->
    <g transform="translate(454.5, 242.5) scale(1.15)">
        <path fill="#00E5FF" d="M 50.0,4.5 A 45.5 45.5 0 1 1 4.5 50.0 L 15.5 50.0 A 34.5 34.5 0 1 0 50.0 15.5 L 50.0,20.0 L 28.0,10.0 L 50.0,0.0 Z" />
        <path fill="#38BDF8" d="M 46.25,26.75 A 3.75 3.75 0 0 1 53.75,26.75 L 53.75,44.25 A 3.75 3.75 0 0 1 46.25,44.25 Z" />
        <path fill="#38BDF8" d="M 64.1,30.6 A 24.0 24.0 0 1 1 35.9,30.6 A 4.25 4.25 0 0 1 40.9,37.5 A 15.5 15.5 0 1 0 59.1,37.5 A 4.25 4.25 0 0 1 64.1,30.6 Z" />
    </g>
    
    <!-- Button Text: RestartNow -->
    <text x="512.0" y="395.0" fill="#FFFFFF" font-size="18" font-family="sans-serif" font-weight="900" text-anchor="middle" letter-spacing="1">RestartNow</text>
    
    <!-- Subtitle Helper Description -->
    <text x="512.0" y="475" fill="#94A3B8" font-size="14" font-family="sans-serif" text-anchor="middle">Chạm để khởi động lại hệ thống ngay lập tức</text>
    
    <!-- Bottom Footer Tip -->
    <text x="512.0" y="570" fill="#475569" font-size="11" font-family="sans-serif" text-anchor="middle" letter-spacing="0.5">Fast Root Reboot • SuperSU Certified</text>
</svg>