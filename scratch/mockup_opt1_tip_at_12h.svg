<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 300 300">
    <rect width="300" height="300" fill="#0A0F1D" />
    
    <!-- Button Background Layers -->
    <!-- Glow ring -->
    <circle cx="150" cy="150" r="125" fill="#00E5FF" opacity="0.08" />
    <!-- Cyan border -->
    <circle cx="150" cy="150" r="115" fill="#0F1F35" stroke="#00E5FF" stroke-width="4" />
    <!-- Inner subtle ring -->
    <circle cx="150" cy="150" r="112" fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.3" />
    
    <!-- Center reference lines (for alignment check) -->
    <line x1="150" y1="20" x2="150" y2="280" stroke="#FF0055" stroke-width="0.5" stroke-dasharray="2,2" opacity="0.4" />
    <line x1="20" y1="150" x2="280" y2="150" stroke="#FF0055" stroke-width="0.5" stroke-dasharray="2,2" opacity="0.4" />
    
    <!-- 9h and 12h reference markers -->
    <!-- 12h top marker -->
    <circle cx="150" cy="104.575" r="3" fill="#F59E0B" />
    <text x="150" y="92.25" fill="#F59E0B" font-size="10" text-anchor="middle" font-family="sans-serif">12h</text>
    
    <!-- 9h left marker -->
    <circle cx="104.575" cy="150" r="3" fill="#F59E0B" />
    <text x="86.25" y="153" fill="#F59E0B" font-size="10" text-anchor="middle" font-family="sans-serif">9h</text>

    <!-- Transformed Icon (Centered exactly at 150, 150) -->
    <g transform="translate(92.5, 92.5) scale(1.15)">
        <!-- Arrow -->
        <path fill="#00E5FF" d="M 5.0,50.0 A 45.0 45.0 0 1 0 65.0,5.0 L 65.0,0.0 L 50.0,10.5 L 65.0,21.0 L 65.0,16.0 A 34.0 34.0 0 1 1 16.0,50.0 Z" />
        <!-- Power Bar -->
        <path fill="#38BDF8" d="M 46.2,26.8 A 3.8 3.8 0 0 1 53.8,26.8 L 53.8,45.2 A 3.8 3.8 0 0 1 46.2,45.2 Z" />
        <!-- Power Ring -->
        <path fill="#38BDF8" d="M 64.1,30.6 A 24.0 24.0 0 1 1 35.9,30.6 A 4.2 4.2 0 0 1 40.9,37.5 A 15.5 15.5 0 1 0 59.1,37.5 A 4.2 4.2 0 0 1 64.1,30.6 Z" />
    </g>
    
    <!-- Button Text "RestartNow" at bottom -->
    <text x="150" y="242" fill="#FFFFFF" font-size="17" font-weight="900" text-anchor="middle" font-family="sans-serif" letter-spacing="1">RestartNow</text>
    
    <!-- Subtitle below mockup -->
    <text x="150" y="285" fill="#38BDF8" font-size="12" text-anchor="middle" font-family="sans-serif">Option 1: Đỉnh mũi tên chạm đúng 12h</text>
</svg>